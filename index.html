<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Zoe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"
      integrity="sha512-aOFyMMzZF7l7ei3vOKgQiRhZnYqk9YC/uMzl4T0j5N5D3Kul+QAFU8ssENDRMAqr/lxDOjMF69dSYJ8HYqY+WQ=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  html, body { margin: 0; padding: 0; background: #000000; }
  body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100svh;
    justify-content: center; gap: 20px; padding: 24px 0;
    box-sizing: border-box;
  }
  /* 78vh term keeps the square plot + slider + equation on screen in landscape */
  #plot { width: min(540px, 92vw, 78vh); height: min(540px, 92vw, 78vh); display: block; }
  #time {
    width: min(540px, 92vw, 78vh); display: block; margin: 0; height: 28px;
    accent-color: #8b5cf6; cursor: pointer;
    touch-action: none; /* scrubbing must not scroll the page on phones */
  }
  #eq {
    color: #e8e8e8; font-size: clamp(0.95rem, 4.2vw, 1.15rem); min-height: 3rem;
    max-width: 92vw; overflow-x: auto; overflow-y: hidden;
  }
</style>
</head>
<body>
<canvas id="plot"></canvas>
<input id="time" type="range" min="0" max="1" step="0.0005" value="0" aria-label="time">
<div id="eq"></div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// A 2D "wavefunction" built from the Fourier decomposition of the heart curve
//   (x^2 + y^2 - 1)^3 - x^2 y^3 <= 0
// Each mode evolves with a free-particle phase e^{-i w (m^2+n^2) t}. Since
// m^2+n^2 is an integer, all phases realign once per PERIOD -> exact revival.
// ---------------------------------------------------------------------------
const DOM    = 1.6;   // plot domain: x, y in [-DOM, DOM]
const M      = 16;    // max frequency per axis (modes m,n in [-M, M])
const K      = 2 * M + 1;
const NGRID  = 256;   // sampling grid for the indicator function
const R      = 256;   // offscreen field resolution
const PERIOD = 12;    // seconds per full revival
const WARP   = 0.55;  // time-warp amount: slows playback near the revival
// Intensity cutoffs for s = |psi| / |psi(center, t=0)|. Normalizing by the
// center value (not the global max, which lands on Gibbs overshoot spikes)
// and thresholding measured-inside-min 0.68 vs measured-outside-max 0.23
// keeps the heart solid and the background clean.
const LO = 0.55, HI = 0.64;
const PURPLE = [139, 92, 246]; // #8b5cf6 — validated >= 3:1 on black

function inHeart(x, y) {
  const a = x * x + y * y - 1;
  return a * a * a - x * x * y * y * y <= 0;
}

// --- Fourier coefficients c_mn of the heart indicator (separable 2-pass DFT)
const cr = new Float64Array(K * K), ci = new Float64Array(K * K);
{
  const f = new Uint8Array(NGRID * NGRID);
  for (let j = 0; j < NGRID; j++) {
    const y = ((j + 0.5) / NGRID - 0.5) * 2 * DOM;
    for (let i = 0; i < NGRID; i++) {
      const x = ((i + 0.5) / NGRID - 0.5) * 2 * DOM;
      f[j * NGRID + i] = inHeart(x, y) ? 1 : 0;
    }
  }
  const Ar = new Float64Array(K * NGRID), Ai = new Float64Array(K * NGRID);
  for (let mi = 0; mi < K; mi++) {
    const m = mi - M;
    for (let j = 0; j < NGRID; j++) {
      let sr = 0, si = 0;
      for (let i = 0; i < NGRID; i++) {
        if (!f[j * NGRID + i]) continue;
        const ph = -2 * Math.PI * m * (i + 0.5) / NGRID;
        sr += Math.cos(ph); si += Math.sin(ph);
      }
      Ar[mi * NGRID + j] = sr; Ai[mi * NGRID + j] = si;
    }
  }
  for (let mi = 0; mi < K; mi++) for (let ni = 0; ni < K; ni++) {
    const n = ni - M;
    let sr = 0, si = 0;
    for (let j = 0; j < NGRID; j++) {
      const ph = -2 * Math.PI * n * (j + 0.5) / NGRID;
      const c = Math.cos(ph), s = Math.sin(ph);
      const ar = Ar[mi * NGRID + j], ai = Ai[mi * NGRID + j];
      sr += ar * c - ai * s; si += ar * s + ai * c;
    }
    cr[mi * K + ni] = sr / (NGRID * NGRID);
    ci[mi * K + ni] = si / (NGRID * NGRID);
  }
}

// --- field synthesis: psi(u,v,t) = sum c_mn e^{-i 2pi t (m^2+n^2)} e^{2pi i (mu+nv)}
const Er = new Float64Array(K * R), Ei = new Float64Array(K * R);
for (let mi = 0; mi < K; mi++) {
  const m = mi - M;
  for (let x = 0; x < R; x++) {
    const ph = 2 * Math.PI * m * (x + 0.5) / R;
    Er[mi * R + x] = Math.cos(ph); Ei[mi * R + x] = Math.sin(ph);
  }
}
const Gr = new Float64Array(K * R), Gi = new Float64Array(K * R);
const rowR = new Float64Array(R), rowI = new Float64Array(R);
const mag2 = new Float64Array(R * R);
const pr = new Float64Array(K), pi = new Float64Array(K);

function synth(tFrac) { // tFrac = t / PERIOD, one full revival per unit
  for (let mi = 0; mi < K; mi++) {
    const m = mi - M, ph = -2 * Math.PI * tFrac * m * m;
    pr[mi] = Math.cos(ph); pi[mi] = Math.sin(ph);
  }
  Gr.fill(0); Gi.fill(0);
  for (let mi = 0; mi < K; mi++) {
    const gOff = mi * R;
    for (let ni = 0; ni < K; ni++) {
      let a = cr[mi * K + ni], b = ci[mi * K + ni];
      let tr = a * pr[mi] - b * pi[mi], ti = a * pi[mi] + b * pr[mi];
      a = tr * pr[ni] - ti * pi[ni]; b = tr * pi[ni] + ti * pr[ni];
      if (a * a + b * b < 1e-18) continue;
      const eOff = ni * R;
      for (let y = 0; y < R; y++) {
        const er = Er[eOff + y], ei = Ei[eOff + y];
        Gr[gOff + y] += a * er - b * ei;
        Gi[gOff + y] += a * ei + b * er;
      }
    }
  }
  for (let y = 0; y < R; y++) {
    rowR.fill(0); rowI.fill(0);
    for (let mi = 0; mi < K; mi++) {
      const gr = Gr[mi * R + y], gi = Gi[mi * R + y];
      const eOff = mi * R;
      for (let x = 0; x < R; x += 4) {
        rowR[x]     += Er[eOff + x]     * gr - Ei[eOff + x]     * gi;
        rowI[x]     += Er[eOff + x]     * gi + Ei[eOff + x]     * gr;
        rowR[x + 1] += Er[eOff + x + 1] * gr - Ei[eOff + x + 1] * gi;
        rowI[x + 1] += Er[eOff + x + 1] * gi + Ei[eOff + x + 1] * gr;
        rowR[x + 2] += Er[eOff + x + 2] * gr - Ei[eOff + x + 2] * gi;
        rowI[x + 2] += Er[eOff + x + 2] * gi + Ei[eOff + x + 2] * gr;
        rowR[x + 3] += Er[eOff + x + 3] * gr - Ei[eOff + x + 3] * gi;
        rowI[x + 3] += Er[eOff + x + 3] * gi + Ei[eOff + x + 3] * gr;
      }
    }
    const o = y * R;
    for (let x = 0; x < R; x++) mag2[o + x] = rowR[x] * rowR[x] + rowI[x] * rowI[x];
  }
}

synth(0);
const norm2 = mag2[(R >> 1) * R + (R >> 1)]; // |psi|^2 at heart center, t=0
const LO2 = LO * LO * norm2, HI2 = HI * HI * norm2;

// --- canvases ------------------------------------------------------------
const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');
const fieldCanvas = document.createElement('canvas');
fieldCanvas.width = R; fieldCanvas.height = R;
const fieldCtx = fieldCanvas.getContext('2d');
const fieldImg = fieldCtx.createImageData(R, R);
{
  const d = fieldImg.data;
  for (let k = 0; k < R * R; k++) {
    d[k * 4] = PURPLE[0]; d[k * 4 + 1] = PURPLE[1]; d[k * 4 + 2] = PURPLE[2];
  }
}

let cssSize = 0, dpr = 1;
const backdrop = document.createElement('canvas');

function toPix(v) { return (v / (2 * DOM) + 0.5) * cssSize; }        // math x -> px
function toPixY(v) { return (0.5 - v / (2 * DOM)) * cssSize; }       // math y -> px

function drawBackdrop() {
  backdrop.width = canvas.width; backdrop.height = canvas.height;
  const b = backdrop.getContext('2d');
  b.scale(dpr, dpr);
  b.fillStyle = '#000000';
  b.fillRect(0, 0, cssSize, cssSize);

  b.lineWidth = 1;
  b.strokeStyle = '#262626';
  b.beginPath();
  for (let g = -3; g <= 3; g++) {
    const t = g * 0.5;
    if (t === 0) continue;
    b.moveTo(toPix(t), 0); b.lineTo(toPix(t), cssSize);
    b.moveTo(0, toPixY(t)); b.lineTo(cssSize, toPixY(t));
  }
  b.stroke();

  b.strokeStyle = '#8b8b8b';
  b.beginPath();
  b.moveTo(toPix(0), 0); b.lineTo(toPix(0), cssSize);
  b.moveTo(0, toPixY(0)); b.lineTo(cssSize, toPixY(0));
  for (let g = -3; g <= 3; g++) {          // tick marks
    const t = g * 0.5;
    if (t === 0) continue;
    b.moveTo(toPix(t), toPixY(0) - 4); b.lineTo(toPix(t), toPixY(0) + 4);
    b.moveTo(toPix(0) - 4, toPixY(t)); b.lineTo(toPix(0) + 4, toPixY(t));
  }
  b.stroke();

  b.fillStyle = '#9a9a9a';
  b.font = '11px system-ui, sans-serif';
  b.textAlign = 'center'; b.textBaseline = 'top';
  for (let g = -3; g <= 3; g++) {
    const t = g * 0.5;
    if (t === 0) continue;
    b.fillText(String(t), toPix(t), toPixY(0) + 7);
  }
  b.textAlign = 'right'; b.textBaseline = 'middle';
  for (let g = -3; g <= 3; g++) {
    const t = g * 0.5;
    if (t === 0) continue;
    b.fillText(String(t), toPix(0) - 8, toPixY(t));
  }
  b.fillText('0', toPix(0) - 6, toPixY(0) + 10);

  b.fillStyle = '#c5c5c5';
  b.font = 'italic 14px Georgia, serif';
  b.textAlign = 'right'; b.textBaseline = 'bottom';
  b.fillText('x', cssSize - 5, toPixY(0) - 6);
  b.textAlign = 'left'; b.textBaseline = 'top';
  b.fillText('y', toPix(0) + 8, 4);
}

function resize() {
  const size = canvas.getBoundingClientRect().width;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if (size === cssSize && d === dpr) return;
  cssSize = size; dpr = d;
  canvas.width = Math.round(size * d);
  canvas.height = Math.round(size * d);
  drawBackdrop();
  lastDrawn = NaN; // force a redraw over the new backdrop
}

function smoothstep(m2) {
  let a = (m2 - LO2) / (HI2 - LO2);
  if (a <= 0) return 0;
  if (a >= 1) return 1;
  return a * a * (3 - 2 * a);
}

function render(tFrac) {
  synth(tFrac);
  const d = fieldImg.data;
  for (let j = 0; j < R; j++) {
    const src = j * R, dst = (R - 1 - j) * R; // flip: math +y is up
    for (let i = 0; i < R; i++) {
      d[(dst + i) * 4 + 3] = (255 * smoothstep(mag2[src + i])) | 0;
    }
  }
  fieldCtx.putImageData(fieldImg, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(backdrop, 0, 0);
  ctx.imageSmoothingEnabled = false;      // nearest-neighbor: no blur on upscale
  ctx.drawImage(fieldCanvas, 0, 0, canvas.width, canvas.height);
}

// --- animation + slider ---------------------------------------------------
// Playback runs through tau in [0,1); the field sees warp(tau), which slows
// time near the revival so the heart lingers, and speeds through mid-period.
function warp(tau) {
  return tau - WARP * Math.sin(2 * Math.PI * tau) / (2 * Math.PI);
}

const slider = document.getElementById('time');
let tau = 0;
let scrubbing = false;
let playing = true; // plays one full cycle, then stops on the revived heart
let last = performance.now();
let lastDrawn = NaN;

slider.addEventListener('pointerdown', () => { scrubbing = true; });
slider.addEventListener('pointerup', () => { scrubbing = false; });
slider.addEventListener('pointercancel', () => { scrubbing = false; });
slider.addEventListener('input', () => {
  tau = parseFloat(slider.value);
  playing = true; // scrubbing re-arms playback toward the next revival
});

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  resize();
  if (!scrubbing && playing) {
    tau += dt / PERIOD;
    if (tau >= 1) { tau = 0; playing = false; } // full heart reached: stop
    slider.value = tau;
  }
  const t = warp(tau);
  if (t !== lastDrawn) { render(t); lastDrawn = t; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"
        integrity="sha512-UPFOadao2nEorjtjl0xUTtN3w20Ja143UPEU6EyJ1mi5MB2bDtMkiWmqGDqi47xNLB5z1dy31GKJDEWhjUJFiQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"
        onload="katex.render('i\\hbar\\,\\frac{\\partial \\Psi}{\\partial t} = -\\frac{\\hbar^{2}}{2m}\\nabla^{2}\\Psi + V\\Psi', document.getElementById('eq'), {displayMode: true, throwOnError: false});"></script>
</body>
</html>
